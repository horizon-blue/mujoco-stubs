[project]
name = "mujoco-stubs"
version = "3.9.0.1"
description = "An unofficial stub-only package providing type hints for MuJoCo, a physics engine for robotics and biomechanics."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Xiaoyan Wang", email = "xxiaoyanwang@gmail.com" }]
requires-python = ">=3.10"
keywords = ["mujoco", "typing", "type-stubs", "robotics", "simulation"]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Stubs Only",
]
dependencies = [
    "numpy",  # numpy array types are directly used in type annotations
    "typing-extensions>=4.12",
]

[project.optional-dependencies]
mujoco = ["mujoco>=3.9.0,<3.10.0"]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[dependency-groups]
generate = ["cyclopts", "pybind11-stubgen==2.5.5"]
dev = [
    "mujoco-stubs[mujoco]",
    "mypy>=2.4.0",
    "pyrefly>=1.3.2",
    "pyright>=1.1.414",
    "ruff>=0.17.0",
    "ty>=0.0.87",
]

[project.urls]
Documentation = "https://github.com/horizon-blue/mujoco-stubs#readme"
Issues = "https://github.com/horizon-blue/mujoco-stubs/issues"
Source = "https://github.com/horizon-blue/mujoco-stubs"

[tool.uv.build-backend]
source-include = ["justfile", "scripts/**", "tests/**", "uv.lock"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
