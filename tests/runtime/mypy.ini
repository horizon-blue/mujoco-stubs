[mypy]

# OpenGL has no typing in this environment. These MuJoCo implementation
# modules are not included in our partial stubs. Allow their imports so stubtest
# can inspect covered bindings; do not suppress errors in our own declarations.
[mypy-OpenGL,OpenGL.*,mujoco.gl_context,mujoco.rendering.classic.gl_context,mujoco._simulate]
ignore_missing_imports = True
